# Discovery module: deliberately probes the scene contract's own ceilings
# (grid axis clamp, path step cap, image count/size cap, and the server's
# shared-output byte clamp) rather than building a game.
[package]
name = "scene-stress"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
